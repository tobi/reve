name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby 4.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Test, lint, and validate signatures
        run: bundle exec rake
      - name: Validate gem package
        run: |
          gem build reve.gemspec
          gem specification ./reve-*.gem name version summary required_ruby_version metadata >/dev/null
