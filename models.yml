# Reve's self-contained model template.
#
# This file is copied into each agent root by `reve init`. Runtime reads only
# <agent>/models.yml; there are no home-directory or global config fallbacks.
#
# apiKey values must be `$ENV_VAR` references; secrets never belong in this file.
# `$ENV_VAR` baseUrl values are also resolved from ENV. A provider with `models: []`
# is discovered from its OpenAI-compatible /models endpoint.
providers:
  llamacpp:
    baseUrl: $LLAMA_CPP_BASE
    api: openai-responses
    apiKey: $LLAMA_API_KEY
    models: []
    compat:
      supportsStore: false
      supportsDeveloperRole: false
      supportsReasoningEffort: false
      maxTokensField: max_tokens

  openai:
    baseUrl: https://api.openai.com/v1
    api: openai-responses
    apiKey: $OPENAI_API_KEY
    models:
      - id: gpt-5.6-luna
        reasoning: true
        contextWindow: 200000
        maxTokens: 8192
    compat:
      supportsStore: true
      supportsDeveloperRole: false
      supportsReasoningEffort: true
      maxTokensField: max_output_tokens
